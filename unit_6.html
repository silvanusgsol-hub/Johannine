<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unit VI: Letters from the Elder · Johannine Writings</title>
<meta name="description" content="Open the three letters of John: a church shaken by false teaching, a warning to the elect lady, and a dispute over hospitality.">
<style>
:root{
  --paper:#fbf8f2; --card:#ffffff; --ink:#1f1b16; --muted:#5f574c; --line:#e3dccf;
  --ok:#1f7a4d; --ok-bg:#e6f4ec; --bad:#b3261e; --bad-bg:#fbeae8; --part:#8a5a00; --part-bg:#fff3d6;
  --focus:#1a5fd0;
  --accent:#1f4e79;--accent-ink:#fff;--tint:#e6eef6;--hero-bg:linear-gradient(135deg,#14304d,#2f5d50);--hero-ink:#f4f1e6;--motif:repeating-linear-gradient(-8deg,transparent 0 34px,rgba(255,255,255,.08) 34px 35px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#15130f; --card:#1f1c17; --ink:#f2ece2; --muted:#b8ae9f; --line:#3a352d;
    --ok:#6fd3a0; --ok-bg:#16301f; --bad:#ff8a80; --bad-bg:#3a1a17; --part:#f2c66d; --part-bg:#382b10;
    --focus:#8ab4ff;
    --accent:#8fc3ff;--accent-ink:#06192b;--tint:#1c2a38;
  }
}
:root[data-theme="dark"]{
  --paper:#15130f; --card:#1f1c17; --ink:#f2ece2; --muted:#b8ae9f; --line:#3a352d;
  --ok:#6fd3a0; --ok-bg:#16301f; --bad:#ff8a80; --bad-bg:#3a1a17; --part:#f2c66d; --part-bg:#382b10;
  --focus:#8ab4ff;
  --accent:#8fc3ff;--accent-ink:#06192b;--tint:#1c2a38;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif}
h1,h2,h3,.serif{font-family:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;line-height:1.25}
a{color:var(--accent)}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
#chtitle:focus{outline:none}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
/* top bar */
.top{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;min-height:56px;flex-wrap:wrap;padding-top:6px;padding-bottom:6px}
.home{font-weight:600;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--line);border-radius:999px;font-size:14px}
.home:hover{border-color:var(--accent)}
.unitname{font-weight:600;font-size:15px;flex:1;min-width:140px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat{font-size:14px;color:var(--muted);white-space:nowrap}
.stat b{color:var(--ink)}
.bar{height:6px;background:var(--line);width:100%}
.bar>i{display:block;height:100%;width:0;background:var(--accent);transition:width .35s ease}
/* hero */
.hero{background:var(--hero-bg);color:var(--hero-ink);position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:var(--motif);opacity:.5;pointer-events:none}
.hero .wrap{position:relative;padding-top:40px;padding-bottom:40px}
.kicker{text-transform:uppercase;letter-spacing:.14em;font-size:12px;font-weight:700;opacity:.85}
.hero h1{font-size:clamp(30px,6vw,46px);margin:.25em 0 .2em}
.hero p.sub{font-size:18px;margin:0;opacity:.92;max-width:640px}
.numeral{position:absolute;right:8px;bottom:-30px;font-family:Georgia,serif;font-size:180px;line-height:1;opacity:.12;font-weight:700;pointer-events:none}
main{padding:24px 0 56px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card+.card{margin-top:16px}
.grid2>.card{margin-top:0}
.mission{border-left:5px solid var(--accent)}
.mission h2{margin-top:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:640px){.grid2{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:0;margin:8px 0 0;list-style:none}
.chips li{background:var(--tint);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:14px}
ul.plain{padding-left:20px;margin:.4em 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 20px;border-radius:10px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:600;cursor:pointer;text-decoration:none}
.btn:hover{filter:brightness(1.07)}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--accent)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;align-items:center}
/* challenge */
.badge{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);background:var(--tint);padding:4px 10px;border-radius:999px}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.lesson{font-size:13px;color:var(--muted)}
.ch h2{font-size:24px;margin:.5em 0 .3em}
.instr{color:var(--muted);margin:0 0 14px;font-size:15px}
.prompt{margin:0 0 14px}
.clue{background:var(--tint);border-radius:10px;padding:12px 14px;margin:0 0 14px;font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:17px}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer;min-height:48px}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .key{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--tint);font-weight:700;font-size:14px}
.opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.partial{border-color:var(--part);background:var(--part-bg)}
.opt[disabled]{cursor:default}
/* sequence */
ol.seq{list-style:none;padding:0;margin:0;display:grid;gap:8px;counter-reset:s}
ol.seq li{display:flex;align-items:center;gap:10px;padding:10px 10px 10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);counter-increment:s}
ol.seq li::before{content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--tint);font-weight:700;font-size:14px}
ol.seq li .txt{flex:1}
ol.seq li.dragging{opacity:.5}
ol.seq li.right{border-color:var(--ok);background:var(--ok-bg)}
ol.seq li.wrong{border-color:var(--bad);background:var(--bad-bg)}
.mv{display:flex;flex-direction:column;gap:4px}
.mv button{width:40px;height:30px;border:1px solid var(--line);border-radius:8px;background:var(--paper);cursor:pointer;font-size:14px}
.mv button:hover:not([disabled]){border-color:var(--accent)}
.mv button[disabled]{opacity:.35;cursor:default}
.handle{cursor:grab;color:var(--muted);user-select:none;padding:0 2px}
/* match & build */
.mrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.mrow:last-child{border-bottom:0}
@media (max-width:640px){.mrow{grid-template-columns:1fr}}
.mrow .l{font-weight:600}
select{width:100%;min-height:44px;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--card)}
select.right{border-color:var(--ok);background:var(--ok-bg)}
select.wrong{border-color:var(--bad);background:var(--bad-bg)}
.fix{font-size:14px;color:var(--ok);margin-top:4px}
.build{display:grid;gap:10px}
.slot{border:1.5px dashed var(--accent);border-radius:12px;padding:10px 12px;background:var(--tint)}
.slot .lab{font-weight:700;font-size:14px;margin-bottom:6px;font-family:"Iowan Old Style",Palatino,Georgia,serif}
.chiasm .slot{margin-left:calc(var(--d,0) * 9%)}
@media (max-width:640px){.chiasm .slot{margin-left:calc(var(--d,0) * 5%)}}
.timeline .slot{position:relative;margin-left:22px}
.timeline .slot::before{content:"";position:absolute;left:-17px;top:16px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.timeline{border-left:3px solid var(--line);padding-left:4px}
/* sort */
.sortlist{display:grid;gap:10px}
.sitem{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--card)}
.sitem.right{border-color:var(--ok);background:var(--ok-bg)}
.sitem.wrong{border-color:var(--bad);background:var(--bad-bg)}
.sitem .t{margin-bottom:8px}
.cats{display:flex;flex-wrap:wrap;gap:6px}
.cat{min-height:38px;padding:6px 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--paper);cursor:pointer;font-size:14px}
.cat[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.cat[disabled]{cursor:default}
.tally{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.tally span{font-size:13px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--tint)}
/* fill */
.scroll{background:var(--scroll-bg,var(--tint));border:1px solid var(--line);border-radius:12px;padding:16px;font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:18px}
.fillrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.fillrow input{flex:1;min-width:200px;min-height:44px;padding:8px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card)}
.fillrow input.right{border-color:var(--ok);background:var(--ok-bg)}
.fillrow input.wrong{border-color:var(--bad);background:var(--bad-bg)}
.hint{margin-top:10px;font-size:15px;color:var(--part)}
/* branch */
.scen{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:14px}
.scen .tag{background:var(--tint);padding:6px 12px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.scen .body{padding:12px 14px}
.srcnote{border-left:4px solid var(--accent);background:var(--tint);padding:10px 14px;border-radius:0 10px 10px 0;margin-top:12px;font-size:15px}
details{margin-top:12px}
summary{cursor:pointer;font-weight:600}
.other{margin:8px 0 0;padding-left:18px}
.other li{margin-bottom:6px}
/* reflect */
textarea{width:100%;min-height:140px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);resize:vertical}
.count{font-size:14px;color:var(--muted);margin-top:6px}
.model{background:var(--tint);border-radius:10px;padding:12px 14px;margin-top:10px}
/* feedback */
.fb{margin-top:18px;border-radius:12px;padding:14px 16px;border:1.5px solid}
.fb.ok{border-color:var(--ok);background:var(--ok-bg)}
.fb.bad{border-color:var(--bad);background:var(--bad-bg)}
.fb.part{border-color:var(--part);background:var(--part-bg)}
.fb.note{border-color:var(--accent);background:var(--tint)}
.fb h3{margin:0 0 6px;font-size:19px}
.fb .src{font-size:13px;color:var(--muted);margin-top:8px}
.fb p{margin:.4em 0}
/* results */
.score-big{font-size:clamp(44px,10vw,72px);font-weight:700;line-height:1;font-family:Georgia,serif;color:var(--accent)}
.rank{font-size:26px;margin:.2em 0}
table.res{width:100%;border-collapse:collapse;margin-top:10px;font-size:15px}
table.res td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
table.res td.n{width:36px;color:var(--muted)}
table.res td.s{width:72px;text-align:right;font-weight:600;white-space:nowrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
footer{color:var(--muted);font-size:13px;text-align:center;padding:0 16px 30px}
.clue,.scroll{border-left:4px solid var(--accent)}
</style>
</head>

<header class="top" role="banner">
  <div class="wrap">

<footer>Johannine Writings · Master of Divinity · Global School of Open Learning. Questions and answers are drawn from the course guide by Joe Thomas.</footer>
<script>
window.UNIT = {
  num: 6, roman: "VI",
  title: "Letters from the Elder",
  subtitle: "Open the three letters of John: a church shaken by false teaching, a warning to the elect lady, and a dispute over hospitality.",
  lessons: [{n:11, t:"1 John"}, {n:12, t:"II and III John"}],
  missionTitle: "Your mission: deliver the elder’s letters",
  mission: [
    "Philip’s church has been shaken. A popular teacher has left with several families and now claims that those who remain do not really know God. Some members are anxious about whom to believe.",
    "You are a courier carrying the elder’s letters to the house churches around Ephesus. Learn what the false teachers claimed and how John answered, then deliver two short letters, one about whom not to welcome and one about whom to welcome, and meet Gaius, Diotrephes and Demetrius."
  ],
  ranks: [
    {min:90, title:"Trusted Courier of the Elder", desc:"Every letter delivered and understood. You hold truth and love together, as the elder does."},
    {min:75, title:"Faithful Messenger", desc:"Most letters arrived safely. Review the challenges you missed."},
    {min:55, title:"Traveller on the Road", desc:"You know the main themes. Review Sections 11.4–11.6 and 12.3–12.5 and try again."},
    {min:0, title:"Guest at the Door", desc:"You have reached the house church door. Reread the Lesson at a Glance for Lessons 11 and 12, then play again."}
  ],
  next: {href:"index.html", label:"Back to the course map"},
  closing: "The course ends with a question for your own church: how will truth and love shape your hospitality and leadership?",
  challenges: [
    {
      type:"sort", lesson:11, section:"11.4",
      title:"Three strands of false teaching",
      prompt:"Sentences beginning “If we say…” or “Those who deny…” seem to allude to the opponents’ teaching. Sort each claim into its strand.",
      cats:["Christological error","Ethical distortion","Claim to special insight"],
      items:[
        {t:"They deny that Jesus is the Christ (2:22)", c:0},
        {t:"They do not confess Jesus Christ come in the flesh (4:1–3)", c:0},
        {t:"They claim to be without sin (1:8, 10)", c:1},
        {t:"They claim to be close to God, yet do not keep his commandments (2:4)", c:1},
        {t:"They claim to love God, yet do not love their brothers and sisters (4:20)", c:1},
        {t:"Their teaching rests on prophetic revelation they attribute to God’s Spirit (4:1)", c:2},
        {t:"They treat knowledge of God as belonging to a privileged few", c:2}
      ],
      explain:"The Christological error has been compared to docetism, the belief that the divine Christ could not dwell in a genuinely human body. John uses the word “know” about 40 times, as if fighting his opponents with their own weapons."
    },
    {
      type:"match", lesson:11, section:"11.5",
      title:"John answers the crisis",
      prompt:"John writes to encourage and stabilise his readers. Match each problem to the truth he affirms against it.",
      heads:["Problem","John’s affirmation"],
      pairs:[
        ["Denying that the man Jesus is the divine Christ","“Jesus is the Christ” (2:22; 4:2)"],
        ["Claiming fellowship with God while living in sin","“God is light” (1:5)"],
        ["Claiming to love God while not loving others","“God is love” (4:8)"],
        ["Treating revelation as secret, for a privileged few","“You all have knowledge” (2:20, 27)"]
      ],
      explain:"The test of knowing God is fundamentally ethical (2:3), with a spiritual test too, the experience of the Spirit (4:13). But claims to experience the Spirit are invalid if coupled with denial of the incarnation (4:1–6)."
    },
    {
      type:"mcq", lesson:11, section:"11.1",
      title:"Same author?",
      clue:"C. H. Dodd argued that three key differences in theology show different authors for 1 John and the Fourth Gospel. The lesson answers each one.",
      prompt:"Which of these is NOT one of Dodd’s three differences?",
      options:[
        {t:"The new commandment", ok:true, why:"The new commandment is one of the common themes: John 13:34 and 1 John 2:7–8."},
        {t:"Eschatology", why:"This is one of Dodd’s three: 1 John expects Christ’s coming soon, against the Gospel’s realized eschatology."},
        {t:"Atonement", why:"This is one of Dodd’s three: 1 John speaks of Christ’s death as an “atoning sacrifice” (2:2; 4:10)."},
        {t:"The Holy Spirit", why:"This is one of Dodd’s three: 1 John does not call the Spirit “Paraclete”."}
      ],
      explain:"The lesson finds more than enough overlap to suggest a single author, explaining the differences by the documents’ different genres and situations."
    },
    {
      type:"mcq", lesson:11, section:"11.2",
      title:"Until the times of Trajan",
      clue:"Irenaeus refers to “the church in Ephesus, founded by Paul and having John continuing with them until the times of [the emperor] Trajan”.",
      prompt:"What does this help the lesson conclude about 1 John?",
      options:[
        {t:"It was probably written in the 90s, to house churches in and around Ephesus", ok:true},
        {t:"It was written in Jerusalem before A.D. 66", why:"The lesson says John probably moved from Palestine to Ephesus about the time of the Jewish revolt (A.D. 66)."},
        {t:"It was written in Rome under Nero", why:"The lesson does not place the letter in Rome."},
        {t:"It was written in the mid-second century", why:"Trajan’s reign began in A.D. 98; the lesson dates the letter to the 90s."}
      ],
      explain:"Irenaeus also says that as a youth he listened to Polycarp, who had been a pupil of John."
    },
    {
      type:"sequence", lesson:11, section:"11.6",
      title:"The spiral of 1 John",
      prompt:"1 John moves like music, with themes returning in variation. Put these sections in order.",
      items:[
        "1:1–4 · Prologue: what we have heard, seen and touched",
        "1:5–2:2 · Because God is light, walk in the light",
        "2:12–17 · Because you belong to God, avoid the false values of the world",
        "2:18–27 · Because you know the truth, renounce those who teach a lie",
        "3:11–24 · Because Jesus has shown what love is, love one another",
        "4:1–6 · Beware of false prophets who would deceive you",
        "4:7–21 · Because God is love, love one another",
        "5:13–21 · Conclusion: Christian certainties"
      ],
      explain:"The letter has none of the normal marks of a letter except the author’s intention to write to a community. Its shape is spiral rather than the tight logic of Romans or Galatians."
    },
    {
      type:"fill", lesson:11, section:"11.6",
      title:"The letter’s purpose",
      before:"Echoing John 20:31, the writer says: “I write these things to you who believe in the name of the Son of God so that you may",
      after:"that you have eternal life” (1 John 5:13).",
      answers:["know","be sure","be certain"],
      hint:"It is the verb John uses about 40 times in this letter."
    },
    {
      type:"fill", lesson:12, section:"12.2",
      title:"Who is the elect lady?",
      before:"In 2 John, “the elect lady” is probably a personification of a local",
      after:", and “her children” are its members.",
      answers:["church","house church","house-church","congregation","local church"],
      hint:"It is one of the house groups within the elder’s sphere of influence."
    },
    {
      type:"build", lesson:12, section:"12.2 and 12.4",
      title:"The anatomy of two letters",
      prompt:"2 and 3 John follow the pattern of a Greek personal letter. Fill each slot.",
      slots:[
        {label:"2 John vv. 1–3 · Opening", answer:"Sender and addressee named, greetings expanded with Christian themes"},
        {label:"2 John v. 4 · Expression of joy", answer:"Some of your children are walking in the truth"},
        {label:"2 John vv. 5–11 · Body", answer:"Love one another, keep the commandments, do not welcome deceivers"},
        {label:"2 John vv. 12–13 · Conclusion", answer:"The elder hopes to visit soon and sends greetings"},
        {label:"3 John v. 2 · Health wish", answer:"A wish for good health, with a comment on spiritual health"},
        {label:"3 John vv. 9–10 · A new problem", answer:"Diotrephes ignores the elder’s letter and refuses the missionaries"}
      ],
      extra:["The vine and the branches","A list of seven signs"],
      explain:"2 and 3 John are the only New Testament letters that share the expression of joy, a common feature of a Greek personal letter."
    },
    {
      type:"match", lesson:12, section:"12.4",
      title:"Characters of 3 John",
      prompt:"Match each person in 3 John to what the letter says about them.",
      heads:["Person","What 3 John shows"],
      pairs:[
        ["Gaius","Welcomes travelling missionaries even though they are strangers"],
        ["Diotrephes","“Loves to be first”, refuses the missionaries and expels those who welcome them"],
        ["Demetrius","Well spoken of by everyone, probably the bearer of the letter"],
        ["The elder","His authority rests on love, respect and years of pastoral leadership, not coercion"],
        ["The travelling missionaries","Keep the elder informed about the churches and need to be “sent on” with support"]
      ],
      explain:"“Send them on” (Greek <i>propempō</i>, v. 6) is a technical term for financially supporting a missionary journey (cf. Acts 15:3; Rom. 15:24)."
    },
    {
      type:"mcq", lesson:12, section:"12.4",
      title:"The trouble with Diotrephes",
      clue:"The elder does not call Diotrephes “antichrist” and does not criticise his Christology.",
      prompt:"So what, according to the lesson, is Diotrephes’s problem?",
      options:[
        {t:"He has too big a view of his own importance and wants power and control", ok:true},
        {t:"He denies that Jesus came in the flesh", why:"That is the false teaching of 1 and 2 John. The elder does not accuse Diotrephes of it."},
        {t:"He welcomes every travelling teacher without discernment", why:"The opposite: he refuses hospitality to the missionaries."},
        {t:"He claims to be without sin", why:"That is one of the false teachers’ claims in 1 John, not the charge against Diotrephes."}
      ],
      explain:"The Greek <i>philoprōteuōn</i> (“loving to be first”, v. 9) names the desire for power the elder criticises."
    },
    {
      type:"branch", lesson:12, section:"12.3",
      title:"Naveen and the visiting preacher",
      scenario:"A visiting preacher arrives at Naveen’s church with a message few have heard before. The elders disagree: one says “welcome him”, another says “turn him away”. Naveen is asked for a principle.",

<script>
(function(){
"use strict";
var U = window.UNIT;
var app = document.getElementById('app');
var TYPES = {
  mcq:{label:'Narrative Detective',icon:'🔍',instr:'Study the clue, then choose the best answer. The options are shuffled every time.'},
  sequence:{label:'Story Sequencer',icon:'⇅',instr:'Put the cards in order. Use the arrow buttons (or drag a card on a computer), then press Check order.'},
  match:{label:'Theme & Character Matcher',icon:'⇄',instr:'Choose the matching answer for every row, then press Check matches.'},
  sort:{label:'Arrange the Evidence',icon:'🗂',instr:'Place every card in a category by pressing a category button, then press Check sorting.'},
  branch:{label:'Choose Your Path',icon:'🛤',instr:'Read the situation and choose how you would respond. Each path shows its consequence.'},
  fill:{label:'Unlock the Scroll',icon:'📜',instr:'Type the missing word or phrase. Spelling variants and close wording are accepted. You have two tries.'},
  build:{label:'Build the Story',icon:'🏛',instr:'Fill every slot of the structure from the drop-down lists, then press Check structure.'},
  reflect:{label:'Reflection Challenge',icon:'✍',instr:'Write a short response in your own words. You then see a model response and a checklist from the course to compare with your own.'}
};
var state = null;
var lastPos = -1;

function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function el(tag, attrs){
  var n=document.createElement(tag);
  if(attrs){for(var k in attrs){var v=attrs[k]; if(v==null||v===false) continue;
    if(k==='text') n.textContent=v; else if(k==='html') n.innerHTML=v;
    else if(k==='class') n.className=v; else if(k.slice(0,2)==='on') n.addEventListener(k.slice(2),v);
    else n.setAttribute(k, v===true?'':v);}}
  for(var i=2;i<arguments.length;i++){var c=arguments[i]; if(c==null) continue;
    if(Array.isArray(c)) c.forEach(function(x){ if(x!=null) n.appendChild(typeof x==='string'?document.createTextNode(x):x);});
    else n.appendChild(typeof c==='string'?document.createTextNode(c):c);}
  return n;
}
function fmt(x){ return (Math.round(x*100)/100).toString(); }
function total(){ return state.scores.reduce(function(a,b){return a+(b||0);},0); }
function storeKey(){ return 'jw-games-unit-'+U.num+'-best'; }
function getBest(){ try{ var v=localStorage.getItem(storeKey()); return v?JSON.parse(v):null; }catch(e){ return null; } }
function setBest(pct){ try{ var b=getBest(); if(!b||pct>b.pct) localStorage.setItem(storeKey(), JSON.stringify({pct:pct,date:new Date().toISOString().slice(0,10)})); }catch(e){} }

function header(){
  document.getElementById('unitname').textContent = 'Unit '+U.roman+' · '+U.title;
  var n=U.challenges.length;
  var p=document.getElementById('stat-progress'), s=document.getElementById('stat-score'), bar=document.getElementById('bar');
  if(!state||state.i<0){ p.textContent=n+' challenges'; s.textContent=''; bar.style.width='0%'; return; }
  var done = state.scores.filter(function(x){return x!=null;}).length;
  if(state.i>=n){ p.innerHTML='<b>Complete</b>'; }
  else p.innerHTML='Challenge <b>'+(state.i+1)+'</b> of '+n;
  s.innerHTML='Score <b>'+fmt(total())+'</b> / '+n;
  bar.style.width=(done/n*100)+'%';
}

function hero(){
  return el('section',{class:'hero'}, el('div',{class:'wrap'},
    el('div',{class:'kicker',text:'Unit '+U.roman+' game · Lessons '+U.lessons.map(function(l){return l.n;}).join(' & ')}),
    el('h1',{text:U.title}), el('p',{class:'sub',text:U.subtitle}),
    el('div',{class:'numeral','aria-hidden':'true',text:U.roman})));
}

function intro(){
  state = {i:-1, scores:U.challenges.map(function(){return null;}), detail:[]};
  header();
  app.innerHTML='';
  var types={}; U.challenges.forEach(function(c){types[c.type]=1;});
  var best=getBest();
  var m = el('main',null, el('div',{class:'wrap'},
    el('section',{class:'card mission'},
      el('h2',{text:U.missionTitle}),
      U.mission.map(function(p){return el('p',{text:p});}),
      el('div',{class:'actions'},
        el('button',{class:'btn',id:'start',onclick:function(){go(0);}},'Begin the mission →'),
        best?el('span',{class:'stat',text:'Your best so far: '+best.pct+'%'}):null)),
    el('div',{class:'grid2',style:'margin-top:16px'},
      el('section',{class:'card'}, el('h3',{text:'Lessons in this game'}),
        el('ul',{class:'plain'}, U.lessons.map(function(l){return el('li',null, el('b',{text:'Lesson '+l.n+': '}), l.t);})),
        el('h3',{text:'Activity types'}),
        el('ul',{class:'chips'}, Object.keys(TYPES).filter(function(t){return types[t];}).map(function(t){return el('li',{text:TYPES[t].icon+' '+TYPES[t].label});}))),
      el('section',{class:'card'}, el('h3',{text:'How scoring works'}),
        el('ul',{class:'plain'},
          el('li',{text:'There are '+U.challenges.length+' challenges, each worth 1 point.'}),
          el('li',{text:'Choice questions and paths: 1 point for the best answer. Some paths earn half a point when they are partly right.'}),
          el('li',{text:'Sequencing, matching, sorting and building: your whole answer is checked at once, and you earn credit for each item placed correctly.'}),
          el('li',{text:'Unlock the Scroll: 1 point on the first try, half a point on the second.'}),
          el('li',{text:'Reflections earn a completion point. They are not marked for quality; compare your answer with the model response.'}),
          el('li',{text:'Answers lock once you submit. Play again to reshuffle everything and start from zero.'}))))
  ));
  app.appendChild(hero()); app.appendChild(m);
  window.scrollTo(0,0);
}

function go(i){
  state.i=i; header();
  if(i>=U.challenges.length){ results(); return; }
  var c=U.challenges[i], T=TYPES[c.type];
  app.innerHTML='';
  var body=el('div');
  var fbSlot=el('div',{'aria-live':'polite'});
  var card=el('section',{class:'card ch'},
    el('div',{class:'meta'}, el('span',{class:'badge'}, T.icon+' '+T.label), el('span',{class:'lesson',text:'Lesson '+c.lesson+(c.section?' · Section '+c.section:'')})),
    el('h2',{tabindex:'-1',id:'chtitle',text:c.title}),
    el('p',{class:'instr',text:c.instr||T.instr}),
    body, fbSlot);
  app.appendChild(el('main',null, el('div',{class:'wrap'}, card)));
  var finish=function(score, verdictClass, verdictText, extra){
    state.scores[i]=score; header();
    var fb=el('div',{class:'fb '+verdictClass},
      el('h3',{text:verdictText+(c.type==='reflect'?'':' · '+fmt(score)+' / 1')}),
      extra||null,
      c.explain?el('p',{html:c.explain}):null,
      c.section?el('div',{class:'src',text:'Source: course guide, Lesson '+c.lesson+', Section '+c.section+'.'}):null);
    var last=(i===U.challenges.length-1);
    var nxt=el('button',{class:'btn',onclick:function(){go(i+1);}}, last?'See my results →':'Next challenge →');
    fbSlot.appendChild(fb); fbSlot.appendChild(el('div',{class:'actions'},nxt));
    nxt.focus({preventScroll:true});
    fb.scrollIntoView({behavior:'smooth',block:'nearest'});
  };
  R[c.type](c, body, finish);
  window.scrollTo(0,0);
  var t=document.getElementById('chtitle'); if(t) t.focus({preventScroll:true});
}
function verdict(score){
  if(score>=0.999) return ['ok','Correct'];
  if(score>0) return ['part','Partly correct'];
  return ['bad','Not quite'];
}

var R={};
/* ---------- MCQ ---------- */
R.mcq=function(c, body, finish){
  if(c.clue) body.appendChild(el('div',{class:'clue',html:c.clue}));
  if(c.prompt) body.appendChild(el('p',{class:'prompt',html:'<b>'+c.prompt+'</b>'}));
  var opts=c.options.map(function(o,k){return {t:o.t, ok:!!o.ok, why:o.why, k:k};});
  var sh, tries=0;
  do{ sh=shuffle(opts); tries++; }while(tries<12 && sh.findIndex(function(o){return o.ok;})===lastPos);
  lastPos = sh.findIndex(function(o){return o.ok;});
  var box=el('div',{class:'opts',role:'group','aria-label':'Answer options'});
  var btns=[];
  sh.forEach(function(o,idx){
    var b=el('button',{class:'opt',type:'button'}, el('span',{class:'key',text:String.fromCharCode(65+idx)}), el('span',{text:o.t}));
    b.addEventListener('click',function(){
      btns.forEach(function(x){x.disabled=true;});
      b.setAttribute('aria-pressed','true');
      btns.forEach(function(x,j){ if(sh[j].ok) x.classList.add('right'); });
      if(!o.ok) b.classList.add('wrong');
      var right=sh.filter(function(x){return x.ok;})[0];
      var v=verdict(o.ok?1:0);
      var extra=el('div',null,
        o.ok?null:el('p',{html:'The answer is <b>'+escapeHtml(right.t)+'</b>.'}),
        o.why?el('p',{html:'<i>About your choice:</i> '+o.why}):null);
      finish(o.ok?1:0, v[0], v[1], extra);
    });
    btns.push(b); box.appendChild(b);
  });
  body.appendChild(box);
};
function escapeHtml(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

/* ---------- SEQUENCE ---------- */
R.sequence=function(c, body, finish){
  if(c.prompt) body.appendChild(el('p',{class:'prompt',html:c.prompt}));
  var items=c.items.map(function(t,k){return {t:t,k:k};});
  var order; var g=0;
  do{ order=shuffle(items); g++; }while(g<20 && order.every(function(o,j){return o.k===j;}));
  var ol=el('ol',{class:'seq','aria-label':'Cards to put in order'});
  var locked=false, dragK=null;
  function draw(focusK, dir){
    ol.innerHTML='';
    order.forEach(function(o,j){
      var up=el('button',{type:'button','aria-label':'Move up: '+o.t, disabled:(j===0||locked)?true:null, onclick:function(){move(j,-1);}},'▲');
      var dn=el('button',{type:'button','aria-label':'Move down: '+o.t, disabled:(j===order.length-1||locked)?true:null, onclick:function(){move(j,1);}},'▼');
      var li=el('li',{draggable:locked?null:'true','data-k':o.k},
        el('span',{class:'handle','aria-hidden':'true',text:'☰'}), el('span',{class:'txt',text:o.t}), el('span',{class:'mv'},up,dn));
      if(!locked){
        li.addEventListener('dragstart',function(e){dragK=o.k;li.classList.add('dragging'); try{e.dataTransfer.setData('text/plain',String(o.k));}catch(x){} });
        li.addEventListener('dragend',function(){li.classList.remove('dragging');dragK=null;});
        li.addEventListener('dragover',function(e){e.preventDefault();});
        li.addEventListener('drop',function(e){e.preventDefault(); if(dragK==null) return;
          var from=order.findIndex(function(x){return x.k===dragK;}), to=order.findIndex(function(x){return x.k===o.k;});
          if(from<0||to<0||from===to) return; var it=order.splice(from,1)[0]; order.splice(to,0,it); draw();});
      }
      if(o.res) li.classList.add(o.res);
      ol.appendChild(li);
      if(focusK===o.k){ var target=(dir<0?up:dn); if(target.disabled) target=(dir<0?dn:up); setTimeout(function(){target.focus();},0); }
    });
  }
  function move(j,d){ var k=j+d; if(k<0||k>=order.length) return; var t=order[j]; order[j]=order[k]; order[k]=t; draw(t.k,d); }
  draw();
  body.appendChild(ol);
  var chk=el('button',{class:'btn',type:'button'},'Check order');
  chk.addEventListener('click',function(){
    locked=true; chk.disabled=true;
    var right=0; order.forEach(function(o,j){ o.res=(o.k===j)?'right':'wrong'; if(o.k===j) right++; });
    draw();
    var score=right/order.length, v=verdict(score);
    var extra=el('div',null, el('p',{text:right+' of '+order.length+' cards are in the correct position.'}),
      score<1?el('div',null, el('p',{html:'<b>Correct order:</b>'}), el('ol',{class:'plain'}, c.items.map(function(t){return el('li',{text:t});}))):null);
    finish(score, v[0], v[1], extra);
  });
  body.appendChild(el('div',{class:'actions'},chk));
};

/* ---------- MATCH ---------- */
R.match=function(c, body, finish){
  if(c.prompt) body.appendChild(el('p',{class:'prompt',html:c.prompt}));
  var rows=shuffle(c.pairs.map(function(p,k){return {l:p[0], r:p[1], k:k};}));
  var rights=c.pairs.map(function(p){return p[1];}).concat(c.extra||[]);
  var sels=[];
  var box=el('div');
  if(c.heads) box.appendChild(el('div',{class:'mrow','aria-hidden':'true'}, el('div',{class:'lesson',text:c.heads[0]}), el('div',{class:'lesson',text:c.heads[1]})));
  rows.forEach(function(r,idx){
    var id='m'+idx;
    var s=el('select',{id:id}, el('option',{value:'',text:'Choose…'}), shuffle(rights).map(function(t){return el('option',{value:t,text:t});}));
    s.addEventListener('change',check);
    sels.push(s);
    box.appendChild(el('div',{class:'mrow'}, el('label',{class:'l','for':id,text:r.l}), el('div',null,s)));
  });
  body.appendChild(box);
  var chk=el('button',{class:'btn',type:'button',disabled:true},'Check matches');
  var note=el('span',{class:'stat'});
  function check(){ var filled=sels.filter(function(s){return s.value;}).length; chk.disabled=filled<sels.length; note.textContent=filled+' of '+sels.length+' chosen'; }
  check();
  chk.addEventListener('click',function(){
    chk.disabled=true; var right=0;
    sels.forEach(function(s,idx){ s.disabled=true; var ok=s.value===rows[idx].r; if(ok){right++; s.classList.add('right');} else { s.classList.add('wrong'); s.parentNode.appendChild(el('div',{class:'fix',text:'✓ '+rows[idx].r})); } });
    var score=right/rows.length, v=verdict(score);
    finish(score, v[0], v[1], el('p',{text:right+' of '+rows.length+' matches are correct.'}));
  });
  body.appendChild(el('div',{class:'actions'},chk,note));
};

/* ---------- BUILD ---------- */
R.build=function(c, body, finish){
  if(c.prompt) body.appendChild(el('p',{class:'prompt',html:c.prompt}));
  var bank=c.slots.map(function(s){return s.answer;}).concat(c.extra||[]);
  var uniq=bank.filter(function(x,i){return bank.indexOf(x)===i;});
  var wrap=el('div',{class:'build '+(c.layout||'')});
  var sels=[];
  c.slots.forEach(function(s,idx){
    var id='b'+idx;
    var sel=el('select',{id:id}, el('option',{value:'',text:'Choose…'}), shuffle(uniq).map(function(t){return el('option',{value:t,text:t});}));
    sel.addEventListener('change',upd);
    sels.push(sel);
    var slot=el('div',{class:'slot',style:s.depth!=null?('--d:'+s.depth):null}, el('label',{class:'lab','for':id,text:s.label}), sel);
    wrap.appendChild(slot);
  });
  body.appendChild(wrap);
  var chk=el('button',{class:'btn',type:'button',disabled:true},'Check structure');
  var note=el('span',{class:'stat'});
  function upd(){ var f=sels.filter(function(s){return s.value;}).length; chk.disabled=f<sels.length; note.textContent=f+' of '+sels.length+' slots filled'; }
  upd();
  chk.addEventListener('click',function(){
    chk.disabled=true; var right=0;
    sels.forEach(function(s,idx){ s.disabled=true; var ok=s.value===c.slots[idx].answer; if(ok){right++; s.classList.add('right');} else { s.classList.add('wrong'); s.parentNode.appendChild(el('div',{class:'fix',text:'✓ '+c.slots[idx].answer})); } });
    var score=right/sels.length, v=verdict(score);
    finish(score, v[0], v[1], el('p',{text:right+' of '+sels.length+' slots are correct.'}));
  });
  body.appendChild(el('div',{class:'actions'},chk,note));
};

/* ---------- SORT ---------- */
R.sort=function(c, body, finish){
  if(c.prompt) body.appendChild(el('p',{class:'prompt',html:c.prompt}));
  var items=shuffle(c.items.map(function(it,k){return {t:it.t, c:it.c, k:k, pick:null};}));
  var tally=el('div',{class:'tally','aria-live':'polite'});
  body.appendChild(tally);
  var list=el('div',{class:'sortlist'});
  var groups=[];
  items.forEach(function(it,idx){
    var btns=c.cats.map(function(cat,ci){
      var b=el('button',{type:'button',class:'cat','aria-pressed':'false'},cat);
      b.addEventListener('click',function(){ it.pick=ci; btns.forEach(function(x,j){x.setAttribute('aria-pressed',j===ci?'true':'false');}); upd(); });
      return b;
    });
    var row=el('div',{class:'sitem'}, el('div',{class:'t',text:it.t}), el('div',{class:'cats',role:'group','aria-label':'Category for: '+it.t}, btns));
    groups.push({row:row,btns:btns,it:it});
    list.appendChild(row);
  });
  body.appendChild(list);
  var chk=el('button',{class:'btn',type:'button',disabled:true},'Check sorting');
  var note=el('span',{class:'stat'});
  function upd(){
    var f=items.filter(function(x){return x.pick!=null;}).length;
    chk.disabled=f<items.length; note.textContent=f+' of '+items.length+' placed';
    tally.innerHTML=''; c.cats.forEach(function(cat,ci){ tally.appendChild(el('span',{text:cat+': '+items.filter(function(x){return x.pick===ci;}).length})); });
  }
  upd();
  chk.addEventListener('click',function(){
    chk.disabled=true; var right=0;
    groups.forEach(function(g){ g.btns.forEach(function(b){b.disabled=true;}); var ok=g.it.pick===g.it.c; if(ok){right++; g.row.classList.add('right');} else { g.row.classList.add('wrong'); g.row.appendChild(el('div',{class:'fix',text:'✓ Belongs in: '+c.cats[g.it.c]})); } });
    var score=right/items.length, v=verdict(score);
    finish(score, v[0], v[1], el('p',{text:right+' of '+items.length+' cards are in the right category.'}));
  });
  body.appendChild(el('div',{class:'actions'},chk,note));
};

/* ---------- FILL ---------- */
function norm(s){
  return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/[‘’“”"'`]/g,'').replace(/[^a-z0-9]+/g,' ').trim()
    .replace(/^(the|a|an) /,'').trim();
}
function accepted(input, answers){
  var n=norm(input); if(!n) return false;
  return answers.some(function(a){ var na=norm(a); if(n===na) return true;
    var re=new RegExp('(^| )'+na.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'( |$)');
    return re.test(n) && n.length<=na.length+18; });
}
R.fill=function(c, body, finish){
  var scroll=el('div',{class:'scroll'}, el('span',{html:c.before}), el('b',{text:' ______ '}), el('span',{html:c.after||''}));
  body.appendChild(scroll);
  var inp=el('input',{type:'text',id:'fillin',autocomplete:'off',autocapitalize:'off',spellcheck:'false','aria-label':'Your answer'});
  var btn=el('button',{class:'btn',type:'button'},'Unlock');
  var hintBox=el('div',{'aria-live':'polite'});
  body.appendChild(el('label',{'for':'fillin',class:'sr',text:'Your answer'}));
  body.appendChild(el('div',{class:'fillrow'},inp,btn));
  body.appendChild(hintBox);
  var tries=0;
  function submit(){
    if(!inp.value.trim()) { inp.focus(); return; }
    tries++;
    if(accepted(inp.value, c.answers)){
      inp.classList.add('right'); inp.disabled=true; btn.disabled=true;
      var sc=tries===1?1:0.5, v=verdict(sc);
      finish(sc, v[0], tries===1?'Scroll unlocked':'Unlocked on the second try', el('p',{html:'Accepted answer: <b>'+escapeHtml(c.answers[0])+'</b>'}));
    } else if(tries===1){
      inp.classList.add('wrong');
      hintBox.innerHTML=''; hintBox.appendChild(el('div',{class:'hint',html:'🔑 Not yet. Hint: '+c.hint+' You have one more try.'}));
      inp.focus(); inp.select();
    } else {
      inp.disabled=true; btn.disabled=true;
      finish(0,'bad','The scroll stays sealed', el('p',{html:'The answer is <b>'+escapeHtml(c.answers[0])+'</b>.'}));
    }
  }
  btn.addEventListener('click',submit);
  inp.addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); submit(); } });
  inp.addEventListener('input',function(){ inp.classList.remove('wrong'); });
};

/* ---------- BRANCH ---------- */
R.branch=function(c, body, finish){
  body.appendChild(el('div',{class:'scen'}, el('div',{class:'tag',text:'Hypothetical scenario · based on the lesson’s opening story'}), el('div',{class:'body',html:c.scenario})));
  if(c.prompt) body.appendChild(el('p',{class:'prompt',html:'<b>'+c.prompt+'</b>'}));
  var opts=shuffle(c.options.map(function(o,k){return {t:o.t,outcome:o.outcome,score:o.score,k:k};}));
  var box=el('div',{class:'opts'}); var btns=[];
  opts.forEach(function(o,idx){
    var b=el('button',{class:'opt',type:'button'}, el('span',{class:'key',text:String.fromCharCode(65+idx)}), el('span',{text:o.t}));
    b.addEventListener('click',function(){
      btns.forEach(function(x){x.disabled=true;}); b.setAttribute('aria-pressed','true');
      btns.forEach(function(x,j){ if(opts[j].score>=1) x.classList.add('right'); });
      if(o.score<1) b.classList.add(o.score>0?'partial':'wrong');
      var v=o.score>=1?['ok','A path the lesson supports']:(o.score>0?['part','A partly helpful path']:['bad','A path the lesson warns against']);
      var others=opts.filter(function(x){return x!==o;});
      var extra=el('div',null, el('p',{html:'<b>Consequence:</b> '+o.outcome}),
        el('details',null, el('summary',{text:'Explore the other paths'}), el('ul',{class:'other'}, others.map(function(x){return el('li',{html:'<b>'+escapeHtml(x.t)+'</b> — '+x.outcome});}))),
        c.source?el('div',{class:'srcnote',html:'<b>What the course actually says:</b> '+c.source}):null);
      finish(o.score, v[0], v[1], extra);
    });
    btns.push(b); box.appendChild(b);
  });
  body.appendChild(box);
};

/* ---------- REFLECT ---------- */
R.reflect=function(c, body, finish){
  if(c.context) body.appendChild(el('div',{class:'clue',html:c.context}));
  body.appendChild(el('p',{class:'prompt',html:'<b>'+c.prompt+'</b>'}));
  var min=c.minWords||25;
  var ta=el('textarea',{id:'refl','aria-label':'Your reflection','aria-describedby':'reflcount'});
  var cnt=el('div',{class:'count',id:'reflcount'});
  var btn=el('button',{class:'btn',type:'button',disabled:true},'Submit reflection');
  function words(){ var t=ta.value.trim(); return t?t.split(/\s+/).length:0; }
  function upd(){ var w=words(); cnt.textContent=w+' words'+(w<min?(' · write at least '+min+' to submit'):' · ready to submit'); btn.disabled=w<min; }
  ta.addEventListener('input',upd); upd();
  body.appendChild(ta); body.appendChild(cnt);
  btn.addEventListener('click',function(){
    ta.readOnly=true; btn.disabled=true;
    var extra=el('div',null,
      el('p',{text:'Completion point awarded. Your answer is not machine-marked; use the model and checklist below to judge it yourself, or share it with your study group.'}),
      el('div',{class:'model'}, el('b',{text:'Model response from the lesson'}), el('p',{html:c.model})),
      c.checklist?el('div',null, el('p',{html:'<b>Did your answer…</b>'}), el('ul',{class:'plain'}, c.checklist.map(function(x){return el('li',{html:x});}))):null);
    finish(1,'note','Reflection recorded', extra);
  });
  body.appendChild(el('div',{class:'actions'},btn));
};

/* ---------- RESULTS ---------- */
function results(){
  header();
  var n=U.challenges.length, t=total(), pct=Math.round(t/n*100);
  setBest(pct);
  var rank=U.ranks.filter(function(r){return pct>=r.min;})[0]||U.ranks[U.ranks.length-1];
  app.innerHTML='';
  app.appendChild(hero());
  var rows=U.challenges.map(function(c,i){return el('tr',null, el('td',{class:'n',text:String(i+1)}), el('td',null, el('span',{text:TYPES[c.type].icon+' '}), c.title), el('td',{class:'s',text:fmt(state.scores[i]||0)+' / 1'}));});
  app.appendChild(el('main',null, el('div',{class:'wrap'},
    el('section',{class:'card mission'},
      el('div',{class:'kicker',style:'color:var(--muted)',text:'Mission complete'}),
      el('div',{class:'score-big',text:pct+'%'}),
      el('p',{style:'margin:.2em 0 0',text:'You scored '+fmt(t)+' out of '+n+'.'}),
      el('h2',{class:'rank',text:'🏅 '+rank.title}),
      el('p',{text:rank.desc}),
      el('div',{class:'actions'},
        el('button',{class:'btn',id:'replay',onclick:function(){ intro(); go(0); }},'↻ Play again (reshuffled)'),
        el('a',{class:'btn ghost',href:'index.html'},'⌂ Back to all units'),
        U.next?el('a',{class:'btn ghost',href:U.next.href},U.next.label+' →'):null)),
    el('section',{class:'card'}, el('h3',{text:'Your challenge record'}), el('table',{class:'res'}, el('tbody',null,rows))),
    U.closing?el('section',{class:'card'}, el('h3',{text:'Carry this forward'}), el('p',{html:U.closing})):null
  )));
  window.scrollTo(0,0);
}

document.title = 'Unit '+U.roman+': '+U.title+' · Johannine Writings';
intro();
window.__game={go:go,intro:intro,state:function(){return state;}};
})();
</script>
